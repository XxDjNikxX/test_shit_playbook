---
- name: deploy grafana docker services
  community.docker.docker_compose_v2:
    project_name: grafana
    pull: always
    definition:
      version: "3.9"
      services:
        grafana:
          image: grafana/grafana-enterprise
          container_name: grafana
          restart: unless-stopped
          ports:
            - '3000:3000'
          volumes:
            - grafana-storage:/var/lib/grafana
      volumes:
            {"grafana-storage"}
  tags:
      - deploy_grafana
